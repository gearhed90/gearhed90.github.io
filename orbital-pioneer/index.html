<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Orbital Pioneer</title>
<meta name="theme-color" content="#0a0e17">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0e17; color: #e8f0ff; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; touch-action: none; }
#ui { position: fixed; top: 0; left: 0; right: 0; padding: 8px 12px; background: rgba(10,14,23,0.85); backdrop-filter: blur(6px); z-index: 10; display: flex; justify-content: space-between; align-items: center; font-size: 14px; flex-wrap: wrap; }
#planetName { font-weight: 600; color: #7ee0ff; }
#resources { display: flex; gap: 12px; flex-wrap: wrap; }
.res { display: flex; align-items: center; gap: 4px; font-size: 13px; }
.res span { color: #a0c8ff; }
#buildPanel { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,14,23,0.92); padding: 10px 8px; z-index: 10; display: flex; gap: 6px; overflow-x: auto; }
.buildBtn { background: #1a2744; border: 1px solid #3a5a8a; color: #e8f0ff; padding: 8px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; min-width: 90px; white-space: normal; text-align: center; line-height: 1.2; }
.buildBtn:disabled { opacity: 0.45; }
.buildBtn:active { background: #2a3f6a; }
#log { position: fixed; top: 52px; left: 12px; font-size: 12px; color: #88aacc; pointer-events: none; max-width: 70%; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<div id="ui">
  <div id="planetName">Luna-1</div>
  <div id="resources">
    <div class="res">Reg: <span id="reg">0</span></div>
    <div class="res">Ice: <span id="ice">0</span></div>
    <div class="res">Pwr: <span id="pwr">0</span></div>
    <div class="res">Aly: <span id="aly">0</span></div>
  </div>
</div>
<div id="log"></div>
<div id="buildPanel">
  <button class="buildBtn" id="btnExtractor" onclick="tryBuild('extractor')">Extractor<br>10 Reg</button>
  <button class="buildBtn" id="btnSolar" onclick="tryBuild('solar')">Solar<br>20R+5I</button>
  <button class="buildBtn" id="btnFactory" onclick="tryBuild('factory')">Foundry<br>50R 20I 30P</button>
  <button class="buildBtn" id="btnLaunch" onclick="tryLaunch()">Launch</button>
</div>
<script type="module">
import * as THREE from 'three';

const WORLD_SIZE = 40;
const MIN_BUILD_DIST = 1.8;
const planets = [
  { name: "Luna-1", ground: 0xc8d0e0, sky: 0x1a2030, rock: 0xa0a8b0, goal: { reg: 200, ice: 50 } },
  { name: "Vesta Drift", ground: 0xe8c878, sky: 0x2a2218, rock: 0xc8a860, goal: { reg: 800, ice: 200, pwr: 100 } },
  { name: "Ceres Hollow", ground: 0xa8c8ff, sky: 0x182030, rock: 0x88a0c0, goal: { reg: 3000, ice: 800, aly: 50 } },
  { name: "Europa Rift", ground: 0x88e8ff, sky: 0x102028, rock: 0x70c0d0, goal: { reg: 12000, ice: 4000, aly: 300 } }
];
let planetIndex = 0;
let resources = { reg: 20, ice: 0, pwr: 0, aly: 0 };
let buildings = [];
let nodes = [];
let pioneer = { x: 0, z: 0, vx: 0, vz: 0 };
let lastTime = performance.now();
let logTimeout;
let terrainGroup = new THREE.Group();

let joy = { active: false, startX: 0, startY: 0, id: null };
const JOY_MAX = 70;
const MOVE_SPEED = 6;

function getHeight(x, z) {
  return Math.sin(x * 0.2) * Math.cos(z * 0.17) * 1.8
       + Math.sin(x * 0.06 + z * 0.08) * 1.2;
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(planets[0].sky);
scene.fog = new THREE.Fog(planets[0].sky, 18, 38);

const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 14, 16);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const ambient = new THREE.AmbientLight(0xffffff, 0.22);
scene.add(ambient);
const dir = new THREE.DirectionalLight(0xffffff, 1.4);
dir.position.set(5, 16, 2);
dir.castShadow = true;
dir.shadow.mapSize.width = 2048;
dir.shadow.mapSize.height = 2048;
dir.shadow.camera.near = 0.5;
dir.shadow.camera.far = 45;
dir.shadow.camera.left = -14;
dir.shadow.camera.right = 14;
dir.shadow.camera.top = 14;
dir.shadow.camera.bottom = -14;
dir.shadow.bias = -0.0008;
scene.add(dir);
const lightTarget = new THREE.Object3D();
scene.add(lightTarget);
dir.target = lightTarget;

const raycaster = new THREE.Raycaster();
const down = new THREE.Vector3(0, -1, 0);
const rayOrigin = new THREE.Vector3();

function sampleGroundY(x, z) {
  rayOrigin.set(x, 20, z);
  raycaster.set(rayOrigin, down);
  const hits = raycaster.intersectObject(ground);
  if (hits.length) return hits[0].point.y;
  return getHeight(x, z);
}

function createGround() {
  const geo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, 56, 56);
  const pos = geo.attributes.position;
  const colors = [];
  const base = new THREE.Color(planets[0].ground);
  const low = base.clone().multiplyScalar(0.28);
  const high = base.clone().lerp(new THREE.Color(0xffffff), 0.65);

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    const h = getHeight(x, y);
    pos.setZ(i, h);
    const t = THREE.MathUtils.clamp((h + 1.8) / 3.6, 0, 1);
    const c = low.clone().lerp(high, t);
    colors.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.receiveShadow = true;
  return mesh;
}
let ground = createGround();
scene.add(ground);
scene.add(terrainGroup);

function clearTerrain() {
  while (terrainGroup.children.length) {
    const c = terrainGroup.children[0];
    terrainGroup.remove(c);
    if (c.geometry) c.geometry.dispose();
    if (c.material) c.material.dispose();
  }
}

function spawnTerrainFeatures() {
  clearTerrain();
  const p = planets[planetIndex];
  const rockMat = new THREE.MeshLambertMaterial({ color: p.rock });

  for (let i = 0; i < 16; i++) {
    const size = 0.32 + Math.random() * 0.5;
    const geo = Math.random() < 0.5
      ? new THREE.DodecahedronGeometry(size, 0)
      : new THREE.BoxGeometry(size * 1.1, size * 0.45, size * 0.8);
    const rock = new THREE.Mesh(geo, rockMat);
    const rx = (Math.random() - 0.5) * (WORLD_SIZE - 8);
    const rz = (Math.random() - 0.5) * (WORLD_SIZE - 8);
    const h = sampleGroundY(rx, rz);
    rock.position.set(rx, h + size * 0.22, rz);
    rock.rotation.y = Math.random() * Math.PI;
    rock.castShadow = true;
    rock.receiveShadow = true;
    terrainGroup.add(rock);
  }
}

const pioneerGroup = new THREE.Group();
const bodyMat = new THREE.MeshLambertMaterial({ color: 0xe8f0ff });
const visorMat = new THREE.MeshLambertMaterial({ color: 0x7ee0ff });
const body = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, 0.9, 6), bodyMat);
body.position.y = 0.55;
body.castShadow = true;
pioneerGroup.add(body);
const head = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.4, 0.45), bodyMat);
head.position.y = 1.15;
head.castShadow = true;
pioneerGroup.add(head);
const visor = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.22, 0.08), visorMat);
visor.position.set(0, 1.15, 0.22);
pioneerGroup.add(visor);
scene.add(pioneerGroup);

const matExtractor = new THREE.MeshLambertMaterial({ color: 0x6a8aaa });
const matSolar = new THREE.MeshLambertMaterial({ color: 0x7ee0ff });
const matFactory = new THREE.MeshLambertMaterial({ color: 0x8a6a4a });
const matReg = new THREE.MeshLambertMaterial({ color: 0xb8c4d0 });
const matIce = new THREE.MeshLambertMaterial({ color: 0x88d0ff });

function createExtractor() {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.5, 0.9), matExtractor);
  base.position.y = 0.25;
  base.castShadow = true;
  g.add(base);
  const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.7, 5), matExtractor);
  tower.position.y = 0.75;
  tower.castShadow = true;
  g.add(tower);
  return g;
}
function createSolar() {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.15, 0.8), matExtractor);
  base.position.y = 0.08;
  base.castShadow = true;
  g.add(base);
  const panel = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.08, 0.6), matSolar);
  panel.position.y = 0.35;
  panel.rotation.x = -0.4;
  panel.castShadow = true;
  g.add(panel);
  return g;
}
function createFactory() {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.7, 1.0), matFactory);
  base.position.y = 0.35;
  base.castShadow = true;
  g.add(base);
  const chimney = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 0.6, 5), matFactory);
  chimney.position.set(0.2, 0.9, 0);
  chimney.castShadow = true;
  g.add(chimney);
  return g;
}
function createNode(type) {
  const geo = type === 'reg'
    ? new THREE.DodecahedronGeometry(0.35, 0)
    : new THREE.OctahedronGeometry(0.4, 0);
  const mat = type === 'reg' ? matReg : matIce;
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  return mesh;
}

function spawnNodes() {
  nodes.forEach(n => scene.remove(n.mesh));
  nodes = [];
  for (let i = 0; i < 14; i++) {
    const type = Math.random() < 0.6 ? 'reg' : 'ice';
    const mesh = createNode(type);
    const x = (Math.random() - 0.5) * (WORLD_SIZE - 6);
    const z = (Math.random() - 0.5) * (WORLD_SIZE - 6);
    const h = sampleGroundY(x, z);
    mesh.position.set(x, h + 0.28, z);
    scene.add(mesh);
    nodes.push({ type, x, z, amount: 8 + Math.random() * 10, mesh });
  }
}

function updatePlanetVisuals() {
  const p = planets[planetIndex];
  scene.background = new THREE.Color(p.sky);
  scene.fog.color.set(p.sky);
  scene.remove(ground);
  ground.geometry.dispose();
  ground.material.dispose();
  ground = createGround();
  const pos = ground.geometry.attributes.position;
  const colors = [];
  const base = new THREE.Color(p.ground);
  const low = base.clone().multiplyScalar(0.25);
  const high = base.clone().lerp(new THREE.Color(0xffffff), 0.7);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    const h = getHeight(x, y);
    const t = THREE.MathUtils.clamp((h + 1.8) / 3.6, 0, 1);
    const c = low.clone().lerp(high, t);
    colors.push(c.r, c.g, c.b);
  }
  ground.geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  scene.add(ground);
  spawnTerrainFeatures();
}

function log(msg) {
  const el = document.getElementById('log');
  el.textContent = msg;
  clearTimeout(logTimeout);
  logTimeout = setTimeout(() => el.textContent = '', 2500);
}

function updateUI() {
  document.getElementById('reg').textContent = Math.floor(resources.reg);
  document.getElementById('ice').textContent = Math.floor(resources.ice);
  document.getElementById('pwr').textContent = Math.floor(resources.pwr);
  document.getElementById('aly').textContent = Math.floor(resources.aly);
  document.getElementById('planetName').textContent = planets[planetIndex].name;
  document.getElementById('btnExtractor').disabled = resources.reg < 10;
  document.getElementById('btnSolar').disabled = resources.reg < 20 || resources.ice < 5;
  document.getElementById('btnFactory').disabled = resources.reg < 50 || resources.ice < 20 || resources.pwr < 30;
  const g = planets[planetIndex].goal;
  const canLaunch = resources.reg >= (g.reg||0) && resources.ice >= (g.ice||0) && resources.pwr >= (g.pwr||0) && resources.aly >= (g.aly||0);
  document.getElementById('btnLaunch').disabled = !canLaunch || planetIndex >= planets.length - 1;
  document.getElementById('btnLaunch').textContent = planetIndex >= planets.length - 1 ? "Final" : "Launch";
}

function isClear(x, z) {
  for (const b of buildings) {
    const dx = b.mesh.position.x - x;
    const dz = b.mesh.position.z - z;
    if (Math.hypot(dx, dz) < MIN_BUILD_DIST) return false;
  }
  const pdx = pioneer.x - x;
  const pdz = pioneer.z - z;
  if (Math.hypot(pdx, pdz) < 1.2) return false;
  return true;
}

function findPlacement(px, pz) {
  const offsets = [
    [0, 1.6], [1.2, 1.4], [-1.2, 1.4], [1.6, 0.8], [-1.6, 0.8],
    [0, 2.2], [1.8, 1.2], [-1.8, 1.2], [2.0, 0], [-2.0, 0]
  ];
  for (const [ox, oz] of offsets) {
    const x = px + ox;
    const z = pz + oz;
    if (isClear(x, z)) return { x, z };
  }
  for (let i = 0; i < 8; i++) {
    const ang = Math.random() * Math.PI * 2;
    const dist = 1.6 + Math.random() * 1.2;
    const x = px + Math.cos(ang) * dist;
    const z = pz + Math.sin(ang) * dist;
    if (isClear(x, z)) return { x, z };
  }
  return null;
}

window.tryBuild = function(type) {
  const px = pioneer.x;
  const pz = pioneer.z;
  const spot = findPlacement(px, pz);
  if (!spot) {
    log("No space nearby");
    return;
  }

  let mesh;
  let costOk = false;
  if (type === 'extractor' && resources.reg >= 10) {
    resources.reg -= 10;
    mesh = createExtractor();
    log("Extractor built");
    costOk = true;
  } else if (type === 'solar' && resources.reg >= 20 && resources.ice >= 5) {
    resources.reg -= 20; resources.ice -= 5;
    mesh = createSolar();
    log("Solar array deployed");
    costOk = true;
  } else if (type === 'factory' && resources.reg >= 50 && resources.ice >= 20 && resources.pwr >= 30) {
    resources.reg -= 50; resources.ice -= 20; resources.pwr -= 30;
    mesh = createFactory();
    log("Foundry online");
    costOk = true;
  }

  if (mesh && costOk) {
    const h = sampleGroundY(spot.x, spot.z);
    mesh.position.set(spot.x, h + 0.02, spot.z);
    scene.add(mesh);
    buildings.push({ type, mesh });
  }
  updateUI();
};

window.tryLaunch = function() {
  if (planetIndex >= planets.length - 1) return;
  const g = planets[planetIndex].goal;
  if (resources.reg >= (g.reg||0) && resources.ice >= (g.ice||0) && resources.pwr >= (g.pwr||0) && resources.aly >= (g.aly||0)) {
    planetIndex++;
    buildings.forEach(b => scene.remove(b.mesh));
    buildings = [];
    pioneer.x = 0;
    pioneer.z = 0;
    spawnNodes();
    updatePlanetVisuals();
    log("Welcome to " + planets[planetIndex].name);
    updateUI();
  }
};

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  let extractors = buildings.filter(b => b.type === 'extractor').length;
  let solars = buildings.filter(b => b.type === 'solar').length;
  let factories = buildings.filter(b => b.type === 'factory').length;
  resources.reg += extractors * 0.7 * dt;
  resources.ice += extractors * 0.15 * dt;
  resources.pwr += solars * 1.2 * dt;
  if (factories > 0 && resources.pwr > 1 && resources.ice > 0.4) {
    resources.aly += factories * 0.12 * dt;
    resources.pwr -= factories * 0.25 * dt;
    resources.ice -= factories * 0.08 * dt;
  }

  nodes.forEach(n => {
    if (n.amount <= 0) return;
    const dx = pioneer.x - n.x;
    const dz = pioneer.z - n.z;
    if (Math.hypot(dx, dz) < 0.8) {
      const take = Math.min(n.amount, 4 * dt);
      n.amount -= take;
      if (n.type === 'reg') resources.reg += take;
      else resources.ice += take;
      n.mesh.scale.setScalar(0.4 + n.amount * 0.06);
    }
  });
  nodes = nodes.filter(n => {
    if (n.amount > 0.5) return true;
    scene.remove(n.mesh);
    return false;
  });

  pioneer.x += pioneer.vx * dt;
  pioneer.z += pioneer.vz * dt;
  if (!joy.active) {
    pioneer.vx *= 0.85;
    pioneer.vz *= 0.85;
  }
  const half = WORLD_SIZE / 2 - 1;
  pioneer.x = Math.max(-half, Math.min(half, pioneer.x));
  pioneer.z = Math.max(-half, Math.min(half, pioneer.z));

  const ph = sampleGroundY(pioneer.x, pioneer.z);
  pioneerGroup.position.set(pioneer.x, ph + 0.04, pioneer.z);
  if (Math.abs(pioneer.vx) + Math.abs(pioneer.vz) > 0.1) {
    pioneerGroup.rotation.y = Math.atan2(pioneer.vx, pioneer.vz);
  }

  lightTarget.position.set(pioneer.x, ph, pioneer.z);
  dir.position.set(pioneer.x + 5, ph + 16, pioneer.z + 2);
  dir.shadow.camera.updateProjectionMatrix();

  const camX = pioneer.x;
  const camZ = pioneer.z + 11;
  camera.position.lerp(new THREE.Vector3(camX, ph + 13, camZ), 0.08);
  camera.lookAt(pioneer.x, ph + 0.7, pioneer.z);

  updateUI();
  renderer.render(scene, camera);
}

function getTouchPos(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  let clientX, clientY;
  if (e.touches && e.touches.length) {
    const t = Array.from(e.touches).find(t => t.identifier === joy.id) || e.touches[0];
    clientX = t.clientX;
    clientY = t.clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function onDown(e) {
  if (e.target.closest && e.target.closest('#buildPanel')) return;
  e.preventDefault();
  const pos = getTouchPos(e);
  joy.active = true;
  joy.startX = pos.x;
  joy.startY = pos.y;
  joy.id = e.touches ? e.touches[0].identifier : null;
}
function onMove(e) {
  if (!joy.active) return;
  e.preventDefault();
  const pos = getTouchPos(e);
  let dx = pos.x - joy.startX;
  let dy = pos.y - joy.startY;
  const dist = Math.hypot(dx, dy);
  if (dist > JOY_MAX) {
    dx = (dx / dist) * JOY_MAX;
    dy = (dy / dist) * JOY_MAX;
  }
  const strength = Math.min(1, dist / JOY_MAX);
  pioneer.vx = (dx / JOY_MAX) * MOVE_SPEED * strength;
  pioneer.vz = (dy / JOY_MAX) * MOVE_SPEED * strength;
}
function onUp() { joy.active = false; joy.id = null; }

renderer.domElement.addEventListener('pointerdown', onDown);
renderer.domElement.addEventListener('pointermove', onMove);
renderer.domElement.addEventListener('pointerup', onUp);
renderer.domElement.addEventListener('pointercancel', onUp);
renderer.domElement.addEventListener('touchstart', onDown, { passive: false });
renderer.domElement.addEventListener('touchmove', onMove, { passive: false });
renderer.domElement.addEventListener('touchend', onUp);
renderer.domElement.addEventListener('touchcancel', onUp);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

spawnTerrainFeatures();
spawnNodes();
updateUI();
requestAnimationFrame(animate);

function save() {
  localStorage.setItem('orbitalPioneer', JSON.stringify({
    resources, planetIndex,
    pioneer: { x: pioneer.x, z: pioneer.z }
  }));
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('orbitalPioneer') || '{}');
    if (d.resources) resources = d.resources;
    if (typeof d.planetIndex === 'number') planetIndex = d.planetIndex;
    if (d.pioneer) { pioneer.x = d.pioneer.x; pioneer.z = d.pioneer.z; }
    updatePlanetVisuals();
  } catch(e) {}
}
load();
if (resources.reg < 5) resources.reg = 20;
setInterval(save, 4000);
window.addEventListener('beforeunload', save);
</script>
</body>
</html>
